name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/jev-browser/scripts/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: node --check jev_ultrafast/snapshot.js
      - run: node --check jev_ultrafast/background.js
